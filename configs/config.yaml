# Retinal Disease Classification Configuration
# ============================================

# Data Configuration
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  image_size: 224
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  num_workers: 4

# Class Labels (APTOS 2019 - Diabetic Retinopathy)
classes:
  - "No_DR"
  - "Mild_DR"
  - "Moderate_DR"
  - "Severe_DR"
  - "Proliferative_DR"

# Model Configuration
model:
  name: "vit_base_patch16_224"  # Options: vit_base_patch16_224, resnet50, efficientnet_b4
  pretrained: true
  num_classes: 5
  dropout: 0.2

# Training Configuration
training:
  batch_size: 8  # Reduced for CPU training
  max_epochs: 100
  learning_rate: 0.0003
  weight_decay: 0.01
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5
  early_stopping_patience: 15
  gradient_clip: 1.0

# Loss Configuration
loss:
  name: "focal"  # Options: focal, cross_entropy
  focal_gamma: 2.0
  label_smoothing: 0.1
  class_weighted: true

# Data Augmentation
augmentation:
  # Training augmentations
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1
    hue: 0.05
  rotation_limit: 15
  scale_range: [0.85, 1.0]
  horizontal_flip: true
  mixup_alpha: 0.2

# Normalization (ImageNet statistics)
normalize:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# Checkpoint & Logging
checkpoint:
  save_dir: "checkpoints"
  save_best_only: true
  monitor: "val_balanced_accuracy"
  mode: "max"

logging:
  log_dir: "logs"
  tensorboard: true
  log_every_n_steps: 10

# Evaluation
evaluation:
  results_dir: "results"
  compute_confusion_matrix: true
  compute_roc_curves: true
  save_predictions: true

# Hardware
hardware:
  device: "cpu"  # Options: cuda, cpu, mps (auto-detects if cuda available)
  mixed_precision: false  # Disabled for CPU
  seed: 42
